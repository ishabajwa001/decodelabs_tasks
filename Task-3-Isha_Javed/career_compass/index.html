<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Career Compass</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #eef2ff;
  --white:   #ffffff;
  --blue:    #2952e3;
  --blue-lt: #4f74f9;
  --blue-bg: #ebefff;
  --navy:    #0f2060;
  --border:  #c7d3ff;
  --text:    #0f2060;
  --sans:    'Inter', sans-serif;
  --serif:   'DM Serif Display', serif;
}

body {
  background: var(--blue);
  font-family: var(--sans);
  color: var(--text);
  min-height: 100vh;
}

/* ── NAV ── */
nav {
  background: #1a40d0;
  border-bottom: 1px solid #2952e3;
  padding: 0 40px;
  height: 64px;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-logo {
  display: flex; align-items: center; gap: 10px;
  color: #ffffff;
}
.nav-logo svg { color: #a8bcff; }
.logo-text {
  font-family: var(--sans);
  font-size: 19px; font-weight: 800;
  color: #ffffff; letter-spacing: -0.02em;
}
.logo-text em {
  font-family: var(--serif);
  font-style: italic; font-weight: 400;
  color: #ffffff; font-size: 21px;
  margin-left: 1px;
}

/* ── PAGE ── */
.page { max-width: 960px; margin: 0 auto; padding: 0 32px 80px; }

/* ── HERO ── */
.hero {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 20px;
  margin-top: 24px;
  padding: 32px 52px;
  display: grid;
  grid-template-columns: 1fr 220px;
  align-items: center;
  gap: 40px;
  overflow: hidden;
}

.hero-text h1 {
  font-family: var(--sans);
  font-size: 52px; font-weight: 800;
  line-height: 1.05; color: var(--navy);
}
.hero-text h1 em {
  font-family: var(--serif);
  font-style: italic; font-weight: 400;
  color: var(--blue-lt); display: block;
  font-size: 56px; line-height: 1.1;
}
.hero-text p {
  margin-top: 16px;
  font-size: 14px; color: #5a6fa8;
  line-height: 1.65; max-width: 320px;
}

/* compass illustration */
.hero-art {
  width: 220px; height: 200px;
  position: relative;
  display: flex; align-items: center; justify-content: center;
  justify-self: center;
}
.compass-svg-wrap {
  filter: drop-shadow(0 4px 16px #2952e325);
}
.art-dot {
  position: absolute;
  width: 8px; height: 8px;
  background: var(--blue-lt); border-radius: 50%;
}
.art-dot.d1 { top: 14px; right: 60px; }
.art-dot.d2 { top: 30px; right: 20px; width: 6px; height: 6px; opacity: 0.5; }
.art-icon {
  position: absolute;
  color: #b8caff; font-size: 22px;
}
.art-icon.i1 { bottom: 40px; left: 10px; }
.art-icon.i2 { top: 40px; left: 30px; }
.art-icon.i3 { bottom: 30px; right: 0; }

/* ── SKILLS CARD ── */
.skills-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 16px;
  margin-top: 20px;
  padding: 28px 32px 32px;
}

.skills-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.skills-label {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--blue);
}
.skills-count {
  font-size: 13px; font-weight: 500; color: #8fa3d8;
}
.skills-count span { color: var(--blue); font-weight: 700; }

.input-box {
  display: flex; align-items: center; gap: 12px;
  border: 1.5px solid var(--blue);
  border-radius: 12px;
  padding: 14px 18px;
  background: var(--white);
  transition: box-shadow 0.2s;
}
.input-box:focus-within { box-shadow: 0 0 0 3px #2952e318; }
.input-plus {
  font-size: 20px; color: var(--blue); font-weight: 300; line-height: 1;
  flex-shrink: 0;
}
.tags-inline { display: flex; flex-wrap: wrap; gap: 7px; flex: 1; align-items: center; }
.skill-input {
  border: none; outline: none;
  font-family: var(--sans); font-size: 15px; color: var(--navy);
  background: transparent; flex: 1; min-width: 160px;
}
.skill-input::placeholder { color: #aabde8; }

.tag {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--blue-bg); border: 1px solid var(--border);
  color: var(--blue); border-radius: 7px;
  font-size: 13px; font-weight: 500;
  padding: 3px 10px; cursor: default;
  animation: pop 0.15s ease;
  white-space: nowrap;
}
@keyframes pop { from{opacity:0;transform:scale(0.85);} to{opacity:1;transform:scale(1);} }
.tag-x { cursor: pointer; opacity: 0.5; margin-left: 2px; font-size: 15px; line-height: 1; }
.tag-x:hover { opacity: 1; }

.input-hint {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 10px; font-size: 13px; color: #8fa3d8;
  flex-wrap: wrap; gap: 6px;
}
.input-hint-left { display: flex; align-items: center; gap: 6px; }
.hint-ok { color: #22c55e; font-weight: 600; }
.hint-low { color: #8fa3d8; }

/* ── QUICK ADD ── */
.quick-section { margin-top: 28px; }
.quick-label {
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: #ffffff; margin-bottom: 14px;
}
.quick-grid { display: flex; flex-wrap: wrap; gap: 10px; }

.quick-btn {
  display: flex; align-items: center; gap: 8px;
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 18px;
  font-family: var(--sans); font-size: 14px; font-weight: 500;
  color: var(--navy); cursor: pointer;
  transition: all 0.15s;
}
.quick-btn:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-bg); }
.quick-btn svg { width: 18px; height: 18px; color: var(--blue); flex-shrink: 0; }

/* ── RUN BUTTON ── */
.run-wrap { margin-top: 28px; }
.run-btn {
  width: 100%; padding: 16px;
  background: var(--blue);
  color: var(--white);
  font-family: var(--serif); font-size: 18px; font-style: italic;
  border: none; border-radius: 12px; cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 18px #2952e330;
}
.run-btn:hover { background: #1e40c8; transform: translateY(-1px); box-shadow: 0 8px 28px #2952e340; }
.run-btn:disabled {
  background: #dde5ff; color: #9aaad8;
  cursor: not-allowed; transform: none; box-shadow: none;
  font-family: var(--sans); font-style: normal; font-size: 15px; font-weight: 500;
}

/* ── RESULTS ── */
.results-section { display: none; }
.results-section.visible { display: block; animation: up 0.35s ease; }
@keyframes up { from{opacity:0;transform:translateY(14px);} to{opacity:1;transform:translateY(0);} }

.results-header {
  font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--blue);
  margin-bottom: 14px; margin-top: 28px;
}

.result-card {
  background: var(--white);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px 26px;
  margin-bottom: 12px;
  position: relative; overflow: hidden;
  transition: box-shadow 0.2s, transform 0.2s;
  animation: up 0.3s ease forwards; opacity: 0;
}
.result-card:hover { box-shadow: 0 6px 28px #2952e315; transform: translateY(-2px); }
.result-card:nth-child(1){animation-delay:0.05s;}
.result-card:nth-child(2){animation-delay:0.13s;}
.result-card:nth-child(3){animation-delay:0.21s;}
.result-card::before {
  content:''; position:absolute; left:0;top:0;bottom:0; width:3px; border-radius:3px 0 0 3px;
}
.result-card.rank-1::before{background:#f59e0b;}
.result-card.rank-2::before{background:var(--blue-lt);}
.result-card.rank-3::before{background:#a78bfa;}

.result-row { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:12px; }
.result-rank { font-size:10px; font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:#8fa3d8; margin-bottom:3px; }
.result-role { font-family:var(--serif); font-size:22px; color:var(--navy); }
.result-pct { font-family:var(--serif); font-style:italic; font-size:30px; }
.rank-1 .result-pct{color:#f59e0b;}
.rank-2 .result-pct{color:var(--blue-lt);}
.rank-3 .result-pct{color:#a78bfa;}

.progress-track{height:5px;background:var(--blue-bg);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;border-radius:3px;transition:width 0.85s cubic-bezier(0.16,1,0.3,1);width:0%;}
.rank-1 .progress-fill{background:#f59e0b;}
.rank-2 .progress-fill{background:var(--blue-lt);}
.rank-3 .progress-fill{background:#a78bfa;}

.reset-btn {
  width:100%; padding:13px;
  background:var(--white); border:1.5px solid var(--border);
  color:var(--blue); border-radius:10px;
  font-family:var(--sans); font-size:13px; font-weight:500;
  cursor:pointer; transition:all 0.15s; margin-top:8px;
}
.reset-btn:hover{background:var(--blue-bg); border-color:var(--blue);}

@media(max-width:700px){
  nav{padding:0 16px;}
  .nav-badge span { display: none; }
  .page{padding:0 14px 60px;}
  .hero{
    grid-template-columns: 1fr;
    padding: 28px 24px 20px;
    gap: 20px;
  }
  .hero-art { width: 160px; height: 160px; justify-self: start; }
  .compass-ring { width: 140px; height: 140px; }
  .compass-inner { width: 100px; height: 100px; }
  .hero-text h1 { font-size: 28px; }
  .hero-text h1 em { font-size: 32px; }
  .skills-card { padding: 20px; }
  .result-role { font-size: 18px; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
    <span class="logo-text">Career<em>Compass</em></span>

</nav>

<div class="page">

  <!-- HERO -->

let userSkills = [];

function computeIDF(){const N=DATASET.length,df={},idf={};DATASET.forEach(i=>[...new Set(i.skills)].forEach(s=>{df[s]=(df[s]||0)+1;}));Object.entries(df).forEach(([s,c])=>{idf[s]=Math.log(N/c);});return idf;}
function computeTFIDF(skills,idf,vocab){const t=skills.length,tf={},vec={};skills.forEach(s=>{tf[s]=(tf[s]||0)+1;});vocab.forEach(k=>{vec[k]=(tf[k]&&idf[k])?(tf[k]/t)*idf[k]:0;});return vec;}
function cosineSim(a,b){let d=0,mA=0,mB=0;Object.keys(a).forEach(k=>{d+=(a[k]||0)*(b[k]||0);mA+=a[k]**2;});Object.keys(b).forEach(k=>{mB+=b[k]**2;});return(mA===0||mB===0)?0:d/(Math.sqrt(mA)*Math.sqrt(mB));}
function recommend(skills,n=3){const idf=computeIDF(),vocab=new Set();DATASET.forEach(r=>r.skills.forEach(s=>vocab.add(s)));skills.forEach(s=>vocab.add(s));const uv=computeTFIDF(skills,idf,vocab);return DATASET.map(r=>({role:r.role,score:cosineSim(uv,computeTFIDF(r.skills,idf,vocab))})).sort((a,b)=>b.score-a.score).slice(0,n);}

function addSkill(raw){
  const s=raw.trim().toLowerCase().replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,"");
  if(!s||userSkills.includes(s))return;
  userSkills.push(s);renderTags();updateUI();
}
function removeSkill(s){userSkills=userSkills.filter(x=>x!==s);renderTags();updateUI();}

function renderTags(){
  const inp=document.getElementById("skill-input");
  const container=document.getElementById("tags-container");
  // remove old tags (keep input)
  [...container.querySelectorAll(".tag")].forEach(t=>t.remove());
  // insert tags before input
  userSkills.forEach(s=>{
    const t=document.createElement("div");t.className="tag";
    t.innerHTML=`${s.replace(/_/g," ")} <span class="tag-x" onclick="removeSkill('${s}')">×</span>`;
    container.insertBefore(t,inp);
  });
}

function updateUI(){
  const n=userSkills.length;
  document.getElementById("counter-num").textContent=n;
  const hint=document.getElementById("hint-text");
  if(n>=3){hint.textContent="Ready! Click below to find your matches.";hint.className="hint-ok";}
  else{hint.textContent=`You need to add at least ${3-n} more skill${3-n!==1?"s":""}.`;hint.className="hint-low";}
  document.getElementById("run-btn").disabled=n<3;
  // dim used quick btns
  document.querySelectorAll(".quick-btn").forEach(b=>{
    const key=b.dataset.key;
    b.style.opacity=userSkills.includes(key)?"0.35":"1";
    b.style.pointerEvents=userSkills.includes(key)?"none":"auto";
  });
}

function runRecommender(){
  const results=recommend(userSkills,3);
  const list=document.getElementById("results-list");list.innerHTML="";
  const labels=["BEST MATCH","2ND MATCH","3RD MATCH"];
  results.forEach((r,i)=>{
    const pct=(r.score*100).toFixed(1);
    const card=document.createElement("div");card.className=`result-card rank-${i+1}`;
    card.innerHTML=`<div class="result-row"><div><div class="result-rank">${labels[i]}</div><div class="result-role">${r.role}</div></div><div class="result-pct">${pct}%</div></div><div class="progress-track"><div class="progress-fill" data-w="${pct}"></div></div>`;
    list.appendChild(card);
  });
  setTimeout(()=>document.querySelectorAll(".progress-fill").forEach(el=>el.style.width=el.dataset.w+"%"),80);
  document.getElementById("input-card").style.display="none";
  document.getElementById("quick-section").style.display="none";
  document.getElementById("results-section").classList.add("visible");
  window.scrollTo({top:0,behavior:"smooth"});
}

function resetAll(){
  userSkills=[];renderTags();updateUI();
  document.getElementById("results-section").classList.remove("visible");
  document.getElementById("input-card").style.display="block";
  document.getElementById("quick-section").style.display="block";
  document.getElementById("results-list").innerHTML="";
  document.getElementById("skill-input").value="";
}

});
inp.addEventListener("blur",()=>{const v=inp.value.trim();if(v){addSkill(v);inp.value="";}});
